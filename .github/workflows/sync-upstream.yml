name: Sync Upstream


on:
  schedule:
    # 每天 UTC 时间 2:00 自动同步一次
    - cron: '0 2 * * *'

  workflow_dispatch:  # 支持手动触发


permissions:
  contents: write


jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/Comfy-Org/ComfyUI-Manager.git
          git fetch upstream main
          git merge upstream/main
          git push https://x-access-token:$GH_TOKEN@github.com/xiaozi369/ComfyUI-Manager.git main
